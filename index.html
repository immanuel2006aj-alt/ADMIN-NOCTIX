<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#080909;--panel:#101211;--panel2:#151816;--line:rgba(226,190,111,.14);--gold:#d8b568;--gold2:#f0d79b;--text:#f4f0e7;--muted:#92958e;--green:#8ac6a0;--red:#e38c82;--shadow:0 18px 55px rgba(0,0,0,.38);--radius:18px}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 78% -10%,rgba(202,163,83,.12),transparent 38%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);padding:34px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(24,27,24,.96),rgba(12,14,13,.96));box-shadow:var(--shadow);position:relative;overflow:hidden}.login-card:before{content:"";position:absolute;width:240px;height:240px;right:-120px;top:-140px;border-radius:50%;background:rgba(216,181,104,.15);filter:blur(25px)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border:1px solid rgba(216,181,104,.5);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:21px}.brand-name{font-weight:800;letter-spacing:.16em;font-size:13px}.brand-sub{font:10px 'DM Mono';color:var(--muted);letter-spacing:.2em;margin-top:4px}.eyebrow{font:10px 'DM Mono';letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.login-card h1{font-size:30px;letter-spacing:-.05em;margin:34px 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:11px;color:#c5c3ba;font-weight:700}.field input,.field textarea,.field select,.searchbox{width:100%;border:1px solid var(--line);background:#090b0a;color:var(--text);padding:13px 14px;border-radius:12px;outline:none;transition:.2s}.field input:focus,.field textarea:focus,.field select:focus,.searchbox:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,181,104,.1)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:var(--text);background:#171a17;font-weight:700;font-size:12px;transition:transform .2s,border-color .2s,background .2s}.btn:hover{transform:translateY(-2px);border-color:rgba(216,181,104,.6)}.btn.primary{background:linear-gradient(135deg,#e2c47e,#b88e43);color:#17130b;border:0}.btn.danger{color:var(--red);border-color:rgba(227,140,130,.25)}.btn.full{width:100%;padding:14px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;position:sticky;top:0;padding:24px 16px;border-right:1px solid var(--line);background:rgba(10,12,11,.86);backdrop-filter:blur(20px);display:flex;flex-direction:column;z-index:10}.side-brand{padding:4px 9px 30px}.nav-label{font:10px 'DM Mono';color:#73786f;letter-spacing:.18em;padding:14px 10px 8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid transparent;color:#a9ada5;padding:12px;border-radius:12px;font-size:12px;font-weight:700}.nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}.nav button.active,.nav button:hover{color:var(--gold2);background:rgba(216,181,104,.08);border-color:rgba(216,181,104,.14)}.side-bottom{margin-top:auto}.user-chip{padding:12px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e2c47e,#9e7639);color:#17130b;font-weight:800}.user-info{min-width:0}.user-info strong{display:block;font-size:11px}.user-info small{color:var(--muted);font:9px 'DM Mono';text-transform:uppercase}.main{min-width:0;padding:26px clamp(18px,3vw,42px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:34px}.crumb{font:10px 'DM Mono';letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.top-actions{display:flex;gap:9px;align-items:center}.icon-btn{width:39px;height:39px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#121512;color:var(--gold)}.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.06em;margin:7px 0}.page-head p{color:var(--muted);font-size:12px;margin:0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:linear-gradient(145deg,rgba(22,25,22,.94),rgba(14,16,15,.96));border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:0 8px 30px rgba(0,0,0,.13);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.stat-icon{color:var(--gold);font-size:17px}.stat-value{font-size:31px;font-weight:800;letter-spacing:-.06em;margin:14px 0 4px}.stat-foot{font:10px 'DM Mono';color:var(--green)}.dashboard-grid{grid-template-columns:1.35fr 1fr}.section-title{font-size:14px;font-weight:800;margin:0 0 16px}.activity{display:grid;gap:13px}.activity-row{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.05)}.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(216,181,104,.5)}.activity-row strong{font-size:11px;display:block}.activity-row small{font:9px 'DM Mono';color:var(--muted)}.quick-grid{grid-template-columns:repeat(2,1fr)}.quick{padding:16px;text-align:left;min-height:100px}.quick b{display:block;font-size:12px;margin:10px 0 4px}.quick small{font-size:10px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}.searchbox{max-width:340px;flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#101311}.data-table{width:100%;border-collapse:collapse;min-width:640px}.data-table th{text-align:left;padding:13px 15px;font:9px 'DM Mono';letter-spacing:.12em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}.data-table td{padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.045);font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.data-table tr:last-child td{border:0}.data-table tr:hover td{background:rgba(216,181,104,.035)}.badge{display:inline-flex;border-radius:30px;padding:5px 9px;background:rgba(138,198,160,.1);color:var(--green);font:9px 'DM Mono';text-transform:uppercase}.badge.pending,.badge.new{color:var(--gold);background:rgba(216,181,104,.1)}.badge.rejected,.badge.archived{color:var(--red);background:rgba(227,140,130,.1)}.row-actions{display:flex;gap:6px}.mini{padding:6px 9px;font-size:10px}.empty{text-align:center;padding:42px 18px;color:var(--muted);font-size:12px}.notice{border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--muted);font-size:11px;line-height:1.6;background:rgba(216,181,104,.035);margin-bottom:15px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(9px);z-index:50;display:grid;place-items:center;padding:16px}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#111411;border:1px solid rgba(216,181,104,.25);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{font-size:18px;margin:0}.modal textarea{min-height:260px;resize:vertical;font:11px 'DM Mono';line-height:1.6}.toast{position:fixed;bottom:22px;right:22px;z-index:100;background:#1c211d;border:1px solid var(--line);padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);font-size:11px;max-width:min(360px,calc(100vw - 32px));animation:rise .25s ease}.toast.error{border-color:rgba(227,140,130,.4);color:#ffb2a8}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.pulse{animation:glow 2.8s infinite}.mobile-menu{display:none}.bottom-nav{display:none}.loading{padding:40px;text-align:center;color:var(--gold);font:11px 'DM Mono'}.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(216,181,104,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.install-hint{font-size:10px;color:var(--muted);margin-top:18px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.main{padding:18px 14px calc(94px + env(safe-area-inset-bottom))}.topbar{margin-bottom:25px}.mobile-menu{display:grid}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}.stats{gap:9px}.card{padding:15px}.stat-value{font-size:26px}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:30;bottom:0;left:0;right:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:rgba(10,12,11,.94);backdrop-filter:blur(22px);border-top:1px solid var(--line)}.bottom-nav button{border:0;background:none;color:var(--muted);font-size:9px;display:grid;justify-items:center;gap:4px;padding:5px 1px}.bottom-nav button.active{color:var(--gold)}.bottom-nav svg{width:18px;height:18px;stroke:currentColor;fill:none}.top-actions .desktop-only{display:none}.toolbar .searchbox{max-width:none;flex-basis:100%}.quick-grid{grid-template-columns:repeat(2,1fr)}.modal{padding:17px}.toast{bottom:calc(85px + env(safe-area-inset-bottom));right:12px}}
@media(max-width:390px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-value{font-size:23px}.brand-name{font-size:11px}}
</style>

<body>
<div id="loginView" class="login-wrap">
  <section class="login-card">
    <div class="brand"><div class="brand-mark">N</div><div><div class="brand-name">NOCTIS</div><div class="brand-sub">TECHNOLOGIES · CONTROL</div></div></div>
    <div class="eyebrow" style="margin-top:38px">Secure workspace / 01</div>
    <h1>Welcome back.</h1><p class="muted" style="font-size:12px;line-height:1.7;margin-bottom:26px">Sign in to access your operations, content and business intelligence.</p>
    <form id="loginForm">
      <div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="you@company.com" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
      <button class="btn primary full" id="loginBtn" type="submit">ACCESS WORKSPACE ↗</button>
    </form>
    <div class="install-hint">Encrypted session · Role-verified access</div>
  </section>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><div class="brand"><div class="brand-mark">N</div><div><div class="brand-name">NOCTIS</div><div class="brand-sub">ADMIN CONSOLE</div></div></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-bottom">
      <div class="user-chip"><div class="avatar" id="avatar">N</div><div class="user-info"><strong id="userEmail">Admin</strong><small id="userRole">ROLE</small></div></div>
      <button class="btn full" id="logoutBtn">Sign out ↗</button>
      <div class="install-hint">NOCTIS SYSTEMS · V1.0</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="crumb">NOCTIS / <span id="crumb">OVERVIEW</span></div></div><div class="top-actions"><button class="icon-btn desktop-only" id="installBtn" title="Install app" aria-label="Install app">⇩</button><button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button><button class="icon-btn mobile-menu" id="mobileInstallBtn" title="Install app">⇩</button></div></header>
    <div id="pageContent"><div class="loading"><span class="spinner"></span>INITIALIZING WORKSPACE</div></div>
  </main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(() => {
'use strict';
const SUPABASE_URL = 'https://vbypjufafwzgcsgskzew.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2E9_n3kyMwTz8vZtxTtxZw_3_c151-T';
const TABLES = {
  team_members:{label:'Team',desc:'Manage people, roles and public team profiles',publicLabel:'Active team',fields:['name','role','bio','image_url','email','linkedin_url','is_active','sort_order']},
  projects:{label:'Projects',desc:'Publish and maintain portfolio projects',publicLabel:'Published projects',fields:['title','description','image_url','project_url','category','is_published','sort_order']},
  customer_reviews:{label:'Reviews',desc:'Review, approve and moderate customer feedback',publicLabel:'Approved reviews',fields:['customer_name','rating','review','status']},
  enquiries:{label:'Enquiries',desc:'Track incoming leads and customer requests',publicLabel:'New enquiries',fields:['name','email','phone','subject','message','status','admin_notes']},
  site_settings:{label:'Settings',desc:'Manage website configuration values',publicLabel:'Website settings',fields:['key','value']}
};
const NAV = [
 {id:'dashboard',label:'Dashboard',icon:'◫'},
 {id:'team_members',label:'Team',icon:'◉'},
 {id:'projects',label:'Projects',icon:'▧'},
 {id:'customer_reviews',label:'Reviews',icon:'☆'},
 {id:'enquiries',label:'Enquiries',icon:'✉'},
 {id:'site_settings',label:'Settings',icon:'⚙'}
];
let db=null, session=null, currentRole='', currentPage='dashboard', deferredPrompt=null, cache={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const isOwner=()=>currentRole==='owner', isAdmin=()=>['owner','admin'].includes(currentRole), isEditor=()=>currentRole==='editor';
function toast(msg,error=false){$('toastRoot').innerHTML=`<div class="toast ${error?'error':''}">${esc(msg)}</div>`;setTimeout(()=>$('toastRoot').innerHTML='',3600)}
function iconSvg(ch){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M12 4v16" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".8"/></svg>`}
function allowed(page){if(page==='site_settings')return isOwner()||currentRole==='admin';return true}
function navHtml(){const visible=NAV.filter(n=>allowed(n.id));$('sideNav').innerHTML=visible.map(n=>`<button data-page="${n.id}" class="${currentPage===n.id?'active':''}"><span>${n.icon}</span>${n.label}</button>`).join('');$('bottomNav').innerHTML=visible.slice(0,5).map(n=>`<button data-page="${n.id}" class="${currentPage===n.id?'active':''}"><span style="font-size:17px">${n.icon}</span>${n.label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)))}
async function init(){
  if(!window.supabase){toast('Unable to load Supabase client. Check your connection.',true);return}
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session:s}}=await db.auth.getSession();if(s)await enter(s);
  db.auth.onAuthStateChange(async(_event,s)=>{if(s&&!session)await enter(s);if(!s){session=null;showLogin()}});
}
function showLogin(){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function enter(s){
 session=s;
 const {data:admin,error}=await db.from('admin_users').select('user_id,role').eq('user_id',s.user.id).maybeSingle();
 if(error||!admin){await db.auth.signOut();session=null;showLogin();toast('This account is not authorized for Noctis Admin.',true);return}
 currentRole=admin.role;
 $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
 $('userEmail').textContent=s.user.email||'Administrator';$('userRole').textContent=currentRole.toUpperCase();$('avatar').textContent=(s.user.email||'N').charAt(0).toUpperCase();
 navHtml();await go('dashboard');
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;btn.textContent='AUTHENTICATING…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});btn.disabled=false;btn.textContent='ACCESS WORKSPACE ↗';if(error){toast(error.message,true);return}await enter(data.session)});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();session=null;showLogin()});
$('refreshBtn').addEventListener('click',()=>go(currentPage));
$('installBtn').addEventListener('click',installApp);$('mobileInstallBtn').addEventListener('click',installApp);
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else toast('Use your browser menu → Add to Home screen / Install app.')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
async function count(table,filters=[]){let q=db.from(table).select('*',{count:'exact',head:true});for(const [c,v] of filters)q=q.eq(c,v);const {count,error}=await q;if(error)throw error;return count||0}
async function load(table){const {data,error}=await db.from(table).select('*').limit(200);if(error)throw error;cache[table]=data||[];return cache[table]}
async function go(page){
 if(!allowed(page)){toast('Your role cannot access this section.',true);return}
 currentPage=page;navHtml();$('crumb').textContent=page==='dashboard'?'OVERVIEW':pretty(page).toUpperCase();
 $('pageContent').innerHTML='<div class="loading"><span class="spinner"></span>LOADING DATA</div>';
 try{if(page==='dashboard')await dashboard();else await tablePage(page)}catch(e){$('pageContent').innerHTML=`<div class="card"><div class="eyebrow">SYSTEM NOTICE</div><h2>Unable to load this section</h2><p class="muted">${esc(e.message||String(e))}</p><button class="btn" onclick="location.reload()">Reload</button></div>`}
}
async function dashboard(){
 const [team,projects,reviews,enquiries]=await Promise.all([
  count('team_members',[['is_active',true]]),count('projects',[['is_published',true]]),count('customer_reviews',[['status','approved']]),count('enquiries',[['status','new']])
 ]);
 $('pageContent').innerHTML=`
 <div class="page-head"><div><div class="eyebrow">Command centre / live overview</div><h1>Good to see you.</h1><p>Your business operations, in one place.</p></div><button class="btn primary" id="dashRefresh">↻ Refresh overview</button></div>
 <div class="grid stats">
 ${stat('Active team',team,'◉','People visible on website')}${stat('Published projects',projects,'▧','Portfolio items live')}${stat('Approved reviews',reviews,'☆','Customer trust signals')}${stat('New enquiries',enquiries,'✉','Needs attention')}
 </div>
 <div class="grid dashboard-grid">
 <section class="card"><h3 class="section-title">Operational pulse</h3><div class="activity">
 <div class="activity-row"><span class="activity-dot pulse"></span><div><strong>Authentication secured</strong><small>Supabase session + database role verified</small></div></div>
 <div class="activity-row"><span class="activity-dot"></span><div><strong>Content workspace ready</strong><small>Team, projects and reviews management</small></div></div>
 <div class="activity-row"><span class="activity-dot"></span><div><strong>Lead desk online</strong><small>Review and process new enquiries</small></div></div>
 </div></section>
 <section class="card"><h3 class="section-title">Quick actions</h3><div class="grid quick-grid">
 ${quick('Add team member','Create a team profile','team_members')}${quick('Add project','Publish a portfolio item','projects')}${quick('Moderate reviews','Approve customer feedback','customer_reviews')}${quick('Open enquiries','Follow up with leads','enquiries')}
 </div></section></div>`;
 $('dashRefresh').onclick=()=>go('dashboard');
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>go(b.dataset.quick));
}
function stat(label,value,ic,foot){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ic}</span></div><div class="stat-value">${value}</div><div class="stat-foot">↗ ${foot}</div></div>`}
function quick(title,sub,page){return `<button class="btn quick" data-quick="${page}"><span style="color:var(--gold);font-size:18px">✧</span><b>${title}</b><small>${sub}</small></button>`}
async function tablePage(table){
 const cfg=TABLES[table];let rows=await load(table);
 const canCreate=table==='site_settings'?isOwner():(table==='enquiries'?isAdmin():true);
 const canEdit=table==='enquiries'?isAdmin():(table==='site_settings'?isOwner():true);
 const canDelete=table==='enquiries'?isAdmin():(table==='site_settings'?isOwner():isAdmin());
 $('pageContent').innerHTML=`
 <div class="page-head"><div><div class="eyebrow">Content operations / ${table}</div><h1>${cfg.label}</h1><p>${cfg.desc}</p></div>${canCreate?'<button class="btn primary" id="addRecord">＋ Add new</button>':''}</div>
 ${table==='enquiries'?'<div class="notice">Incoming enquiries are public submissions. Editors can view them; only Owner and Admin can update or delete them.</div>':''}
 <div class="toolbar"><input class="searchbox" id="tableSearch" placeholder="Search records…" aria-label="Search records"><span class="muted" style="font:10px DM Mono">${rows.length} RECORDS · MAX 200 LOADED</span><button class="btn" id="reloadTable">↻ Reload</button></div>
 <div class="table-wrap"><table class="data-table"><thead><tr><th>Record</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table><div id="emptyState" class="empty hidden">No records found.</div></div>
 <div class="notice" style="margin-top:14px">Data is loaded directly from Supabase with your signed-in role. Database Row Level Security remains the authority for every operation.</div>`;
 const render=filtered=>{const body=$('tableBody');body.innerHTML=filtered.map((r,i)=>{
  const id=r.id??r.user_id??r.key??i;
  const primary=r.name??r.title??r.customer_name??r.key??r.email??`Record ${i+1}`;
  const details=r.role??r.description??r.subject??r.email??r.project_url??Object.keys(r).slice(1,3).map(k=>`${k}: ${String(r[k]).slice(0,35)}`).join(' · ');
  const status=r.status??(r.is_active===true?'active':r.is_active===false?'inactive':r.is_published===true?'published':r.is_published===false?'draft':'—');
  const actions=`${canEdit?`<button class="btn mini" data-edit="${esc(id)}">Edit</button>`:''}${canDelete?`<button class="btn mini danger" data-delete="${esc(id)}">Delete</button>`:''}`;
  return `<tr><td title="${esc(primary)}"><strong>${esc(primary)}</strong></td><td title="${esc(details)}">${esc(details||'—')}</td><td><span class="badge ${esc(String(status).toLowerCase())}">${esc(status)}</span></td><td><div class="row-actions">${actions||'<span class="muted">View only</span>'}</div></td></tr>`;
 }).join('');$('emptyState').classList.toggle('hidden',filtered.length>0);};
 render(rows);
 $('tableSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)))});
 $('reloadTable').onclick=()=>go(table);
 if(canCreate)$('addRecord').onclick=()=>openEditor(table,null);
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const row=rows.find((r,i)=>String(r.id??r.user_id??r.key??i)===b.dataset.edit);openEditor(table,row)});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(table,b.dataset.delete,rows));
}
function openEditor(table,row){
 const cfg=TABLES[table],isNew=!row;
 const starter={};
 if(table==='team_members')Object.assign(starter,{name:'',role:'',bio:'',image_url:'',is_active:true,sort_order:0});
 if(table==='projects')Object.assign(starter,{title:'',description:'',image_url:'',project_url:'',category:'',is_published:false,sort_order:0});
 if(table==='customer_reviews')Object.assign(starter,{customer_name:'',rating:5,review:'',status:'pending'});
 if(table==='enquiries')Object.assign(starter,{name:'',email:'',phone:'',subject:'',message:'',status:'new',admin_notes:null});
 if(table==='site_settings')Object.assign(starter,{key:'',value:{}});
 const value=row?Object.fromEntries(Object.entries(row).filter(([k])=>k!=='id'&&k!=='created_at'&&k!=='updated_at')):starter;
 $('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><div><div class="eyebrow">${isNew?'Create record':'Edit record'}</div><h2>${cfg.label}</h2></div><button class="icon-btn" id="closeModal">×</button></div><div class="notice">Advanced record editor. Keep the JSON valid. Existing IDs and timestamps are protected and handled by the database.</div><div class="field"><label>RECORD JSON</label><textarea id="jsonEditor" spellcheck="false">${esc(JSON.stringify(value,null,2))}</textarea></div><div style="display:flex;justify-content:flex-end;gap:9px"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveRecord">Save changes ↗</button></div></section></div>`;
 $('closeModal').onclick=$('cancelModal').onclick=()=> $('modalRoot').innerHTML='';
 $('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')$('modalRoot').innerHTML=''});
 $('saveRecord').onclick=async()=>{
  let payload;try{payload=JSON.parse($('jsonEditor').value)}catch(e){toast('Invalid JSON: '+e.message,true);return}
  if(!payload||Array.isArray(payload)||typeof payload!=='object'){toast('Record must be a JSON object.',true);return}
  if(row?.id)delete payload.id;if(row?.user_id)delete payload.user_id;delete payload.created_at;delete payload.updated_at;
  const btn=$('saveRecord');btn.disabled=true;btn.textContent='SAVING…';
  let result;
  if(isNew)result=await db.from(table).insert(payload);
  else {let q=db.from(table).update(payload);if(row.id)q=q.eq('id',row.id);else if(row.user_id)q=q.eq('user_id',row.user_id);else if(row.key)q=q.eq('key',row.key);else {toast('Cannot identify this row for update.',true);btn.disabled=false;btn.textContent='Save changes ↗';return}result=await q}
  if(result.error){toast(result.error.message,true);btn.disabled=false;btn.textContent='Save changes ↗';return}
  $('modalRoot').innerHTML='';toast('Record saved.');go(table);
 };
}
async function deleteRecord(table,id,rows){
 const row=rows.find((r,i)=>String(r.id??r.user_id??r.key??i)===String(id));if(!row||!confirm('Delete this record permanently?'))return;
 let q=db.from(table).delete();if(row.id)q=q.eq('id',row.id);else if(row.user_id)q=q.eq('user_id',row.user_id);else if(row.key)q=q.eq('key',row.key);else{toast('Cannot identify record.',true);return}
 const {error}=await q;if(error){toast(error.message,true);return}toast('Record deleted.');go(table);
}
init();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err)));
}
})();
</script>
</body>
</html>
